name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    steps:
      - name: PR Agent action
        id: pragent
        uses: Codium-ai/pr-agent@main
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Configure the agent to use Gemini instead of default OpenAI
          CONFIG.MODEL_PROVIDER: "google"
          # Prefix with 'gemini/' to force LiteLLM to use AI Studio instead of GCP Vertex AI
          CONFIG.MODEL: "gemini/gemini-2.5-flash" 
          CONFIG.FALLBACK_MODELS: "gemini/gemini-1.5-pro"
